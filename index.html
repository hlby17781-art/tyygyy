<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEROGUARD Cloud</title><style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#f4f7fb;color:#172033;margin:0}header{background:#102a43;color:#fff;padding:18px 24px}main{max-width:1100px;margin:22px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,table{background:#fff;border-radius:12px;box-shadow:0 2px 12px #10243d14}.card{padding:18px}.num{font-size:30px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:12px;border-bottom:1px solid #edf0f3;text-align:right}th{background:#edf4fb}button{padding:10px 14px;background:#1769aa;color:#fff;border:0;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><header><b>AEROGUARD</b> — المركز السحابي <span id="s" style="float:left">...</span></header><main><div class="grid"><div class="card">الأجهزة<div id="d" class="num">0</div></div><div class="card">GPS<div id="g" class="num">0</div></div><div class="card">السجلات<div id="r" class="num">0</div></div></div><div class="card" style="margin-top:18px"><button onclick="load()">تحديث الآن</button><table><thead><tr><th>الجهاز</th><th>آخر ظهور</th><th>الموقع</th><th>الدقة</th><th>البطارية</th></tr></thead><tbody id="rows"><tr><td colspan="5">لا توجد بيانات</td></tr></tbody></table></div></main><script>async function load(){try{let[d,l,r]=await Promise.all([fetch('/api/devices').then(x=>x.json()),fetch('/api/locations').then(x=>x.json()),fetch('/api/records').then(x=>x.json())]);s.textContent='متصل';dEl.textContent=d.devices.length;gEl.textContent=l.locations.length;rEl.textContent=r.records.length;rows.innerHTML=l.locations.map(x=>`<tr><td>${x.name||x.id}</td><td>${x.last_seen||'-'}</td><td>${Number(x.latitude).toFixed(6)}, ${Number(x.longitude).toFixed(6)}</td><td>${x.accuracy??'-'} م</td><td>${x.battery??'-'}%</td></tr>`).join('')||'<tr><td colspan="5">لا توجد مواقع</td></tr>'}catch(e){s.textContent='خطأ اتصال'}}const dEl=document.getElementById('d'),gEl=document.getElementById('g'),rEl=document.getElementById('r'),rows=document.getElementById('rows'),s=document.getElementById('s');load();setInterval(load,10000)</script></html>
